name: maven-local

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  publish-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform 34
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Unit tests
        run: ./gradlew :signaturepad:testDebugUnitTest :signaturepad-compose:testDebugUnitTest --no-daemon --stacktrace
      - name: Publish libraries to Maven Local
        run: ./gradlew :signaturepad:publishToMavenLocal :signaturepad-compose:publishToMavenLocal --no-daemon --stacktrace
      - name: Assemble Android host
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace
      - name: Build H5 host
        run: ./gradlew :h5App:jsBrowserProductionWebpack --no-daemon --stacktrace
