name: iosApp
options:
  bundleIdPrefix: com.foowrites.kuikly
  deploymentTarget:
    iOS: "14.1"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/iosApp-Bridging-Header.h"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.foowrites.kuikly.signaturepad
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies: []
    postBuildScripts: []
