#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=34

#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.applyDefaultHierarchyTemplate=false
# 允许在 Linux（JitPack）上编译并发布 iOS klib
kotlin.native.enableKlibsCrossCompilation=true

ksp.incremental=false
compose.ios.resources.sync=false

#Versions
# 产物版本号为 {MAVEN_VERSION}-{Kotlin 版本}，鸿蒙产物使用 OHOS_KOTLIN_VERSION
MAVEN_VERSION=0.2.1
KOTLIN_VERSION=2.1.21
KUIKLY_VERSION=2.29.2-2.1.21
OHOS_KOTLIN_VERSION=2.0.21-KBA-010
KUIKLY_OHOS_VERSION=2.23.2-2.0.21-ohos
